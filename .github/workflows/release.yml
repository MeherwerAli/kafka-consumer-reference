name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@meherwerali"
      - name: Confirm tag matches package version
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify package
        run: npm run verify
      - name: Build release tarball
        run: |
          mkdir -p package-dist
          npm pack --pack-destination package-dist
      - name: Generate checksum
        run: sha256sum package-dist/*.tgz > package-dist/SHA256SUMS.txt
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published."
          else
            npm publish
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" package-dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" package-dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
